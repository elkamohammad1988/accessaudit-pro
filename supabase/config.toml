# AccessAudit Pro — Supabase local/dev configuration
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "accessaudit-pro"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323

[inbucket]
# Local email testing inbox (catches confirmation / magic-link / invite emails)
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# Generated white-label PDF reports — private, served via signed URLs.
[storage.buckets.reports]
public = false

# Agency / client logos used for white-label branding — public read.
[storage.buckets.branding]
public = true

# NOTE: the `screenshots` bucket is intentionally omitted in the MVP — per-page
# screenshots are deferred (storage cost, no MVP value). See docs/DB_REVIEW.md §5.

[auth]
enabled = true
site_url = "http://localhost:3000"
# Allow-list every localhost auth redirect target. `/**` covers /auth/callback
# and /auth/confirm. Keep these in sync with the hosted dashboard's Redirect URLs.
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/**",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/confirm",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
# Magic-link + password are both supported by the product.
secure_password_change = true
# Email link / OTP validity (seconds). 1 hour is long enough to click a fresh
# link yet short enough to satisfy Supabase's security advisory (<= 1h).
otp_expiry = 3600
# Min gap between transactional emails to the same address. Short for local
# testing of the resend flow; the hosted project enforces its own rate limits.
max_frequency = "20s"

# Email templates use a token_hash link to the app's own /auth/confirm route
# (verifyOtp), NOT the default {{ .ConfirmationURL }} — see the template files
# for why. content_path is resolved from the project root.
[auth.email.template.confirmation]
subject = "Confirm your AccessAudit Pro email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your AccessAudit Pro password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Sign in to AccessAudit Pro"
content_path = "./supabase/templates/magic_link.html"

# OAuth providers are deferred to v1.1 (see PRD §9.2). Left disabled.
[auth.external.google]
enabled = false
