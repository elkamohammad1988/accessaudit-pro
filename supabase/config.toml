# AccessAudit Pro — Supabase local/dev configuration
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "accessaudit-pro"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323

[inbucket]
# Local email testing inbox (catches confirmation / magic-link / invite emails)
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# Generated white-label PDF reports — private, served via signed URLs.
[storage.buckets.reports]
public = false

# Agency / client logos used for white-label branding — public read.
[storage.buckets.branding]
public = true

# NOTE: the `screenshots` bucket is intentionally omitted in the MVP — per-page
# screenshots are deferred (storage cost, no MVP value). See docs/DB_REVIEW.md §5.

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
# Magic-link + password are both supported by the product.
secure_password_change = true

# OAuth providers are deferred to v1.1 (see PRD §9.2). Left disabled.
[auth.external.google]
enabled = false
